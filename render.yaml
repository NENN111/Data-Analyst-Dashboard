services:
  - type: web
    # Имена существующих Render-ресурсов являются их Blueprint-идентификаторами.
    # Не меняйте их здесь без предварительного переименования ресурсов в Render.
    name: hh-vacancies-dashboard
    runtime: python
    # Платный веб-сервис не приостанавливается при отсутствии трафика.
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hh-vacancies-postgres
          property: connectionString

databases:
  # databaseName и user неизменяемы после создания Render Postgres.
  # Для полного переименования нужна миграция в новый экземпляр базы данных.
  - name: hh-vacancies-postgres
    databaseName: hh_analytics
    user: hh_user
    plan: free
