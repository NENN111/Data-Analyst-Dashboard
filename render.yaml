services:
  - type: web
    name: hh-vacancies-dashboard
    runtime: python
    # Paid instance: unlike a free web service, it is not suspended when idle.
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hh-vacancies-postgres
          property: connectionString

databases:
  - name: hh-vacancies-postgres
    databaseName: hh_analytics
    user: hh_user
    plan: free
