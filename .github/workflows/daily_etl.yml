name: Daily Vacancies ETL

on:
  schedule:
    # Ежедневно в 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  collect-vacancies:
    runs-on: ubuntu-latest
    env:
      # В секрете хранится External Database URL из Render.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Перманентный OAuth2 access token активированного приложения Хабр Карьеры.
      HABR_CAREER_ACCESS_TOKEN: ${{ secrets.HABR_CAREER_ACCESS_TOKEN }}
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Загрузить вакансии из Работа России
        run: python trudvsem_etl.py --pages 5

      - name: Загрузить вакансии из Хабр Карьеры
        run: python habr_career_etl.py
