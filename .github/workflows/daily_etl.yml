name: Daily Vacancies ETL

on:
  schedule:
    # Ежедневно в 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  collect-vacancies:
    runs-on: ubuntu-latest
    env:
      # В секрете хранится External Database URL из Render.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Перманентный OAuth2 access token активированного приложения Хабр Карьеры.
      HABR_CAREER_ACCESS_TOKEN: ${{ secrets.HABR_CAREER_ACCESS_TOKEN }}
      # Secret key зарегистрированного приложения SuperJob.
      SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
      # OAuth2-учётные данные приложения hh.ru.
      HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}
      HH_CLIENT_ID: ${{ secrets.HH_CLIENT_ID }}
      HH_CLIENT_SECRET: ${{ secrets.HH_CLIENT_SECRET }}
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Загрузить вакансии из Работа России
        run: python trudvsem_etl.py --pages 5

      - name: Загрузить вакансии из hh.ru
        if: ${{ !cancelled() }}
        run: python hh_etl.py

      - name: Загрузить вакансии из SuperJob
        if: ${{ !cancelled() && env.SUPERJOB_API_KEY != '' }}
        run: python superjob_etl.py

      - name: Загрузить публичные вакансии из Хабр Карьеры
        if: ${{ !cancelled() }}
        run: python habr_public_etl.py

      - name: Загрузить вакансии из Хабр Карьеры
        if: ${{ !cancelled() }}
        run: python habr_career_etl.py
