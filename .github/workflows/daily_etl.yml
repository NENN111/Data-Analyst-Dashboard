name: Daily HH ETL

on:
  schedule:
    # Every day at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  collect-vacancies:
    runs-on: ubuntu-latest
    env:
      # Add the external Render database URL as this GitHub Actions secret.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load fresh HH.ru vacancies
        run: python etl.py --pages 5
